# ntp.ini - libsystemd unit that loads and enables dmntp at boot, so dmutc
# finds it as an external UTC source (the dmutc_read_source DIF) and sets
# the RTC from it: right after the start (again every minute until the
# network is up) and then once a day. Install it with the standard tag:
#
#   dmntp service=ntp.ini
#
description=NTP time source (dmntp)
exec=dmntp
type=library
